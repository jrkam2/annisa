<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/webp" href="img/annisa.webp">
<script>window.EJI_WEB=1</script>
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ffffff">
<title>Dashboard AEON EJI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* layout: app bar lengket (logo + menu), satu kolom maks 1200px; kartu putih lembut di atas latar abu kebiruan; status dengan pill berwarna */
:root{
  color-scheme: light only;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F6F5FB; --ink:#141A33; --ink-2:#474E66; --muted:#6C7088;
  --line:#E9E7F2; --line-2:#D6D2E5; --bar:#C9C3DE;
  --purple:#7E3AA6; --purple-soft:#F3ECFA; --purple-ink:#6A2C91;
  --accent:#0068B8; --accent-ink:#0B4F94; --accent-soft:#E6F1FB; --on-accent:#FFFFFF;
  --brand-1:#0068B8; --brand-navy:#5B3FB0; --brand-2:#B0388A; --brand-2-soft:#F7E8F2;
  --pos:#067647; --pos-soft:#E6F6EE; --warn:#B54708; --warn-soft:#FFF3E0; --neg:#C0261A; --neg-soft:#FDECEA; --neg-mark:#F04438;
  --shadow:0 1px 2px rgba(40,30,90,.04),0 4px 14px rgba(40,30,90,.05);
  --radius:14px;
  --f-display:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root.never-dark{
    color-scheme: dark;
    --bg:#0B1220; --surface:#121B2B; --surface-2:#172234; --ink:#EDF2F8; --ink-2:#B2BDCD; --muted:#8592A8;
    --line:#223047; --line-2:#31415C; --bar:#40536F;
    --accent:#4AA3E6; --accent-ink:#8CC8F2; --accent-soft:#0F2E4A; --on-accent:#0B1220;
    --brand-2:#D86DB6; --brand-2-soft:#3A1830; --purple:#C495E8; --purple-soft:#2A1D3D; --purple-ink:#D9B8F2;
    --pos:#47CD89; --pos-soft:#11291F; --warn:#F5B451; --warn-soft:#2E2312; --neg:#FF8A80; --neg-soft:#331816; --neg-mark:#F0584B;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
:root.never-dark{
  color-scheme: dark;
  --bg:#0B1220; --surface:#121B2B; --surface-2:#172234; --ink:#EDF2F8; --ink-2:#B2BDCD; --muted:#8592A8;
  --line:#223047; --line-2:#31415C; --bar:#40536F;
  --accent:#4AA3E6; --accent-ink:#8CC8F2; --accent-soft:#0F2E4A; --on-accent:#0B1220;
  --brand-2:#D86DB6; --brand-2-soft:#3A1830; --purple:#C495E8; --purple-soft:#2A1D3D; --purple-ink:#D9B8F2;
  --pos:#47CD89; --pos-soft:#11291F; --warn:#F5B451; --warn-soft:#2E2312; --neg:#FF8A80; --neg-soft:#331816; --neg-mark:#F0584B;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.appbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.appbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);min-width:0}
.brand:hover{text-decoration:none}
.appbar::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--brand-1,#0088D0) 0%,var(--brand-navy,#1B2A8A) 55%,var(--brand-2) 100%)}
.logos{display:flex;align-items:center;gap:10px;flex:none}
.logos img{display:block;width:auto}
.logos .l-eka{height:42px}
.logos .l-sep{width:1px;height:26px;background:var(--line-2)}
.logos .l-aeon{height:20px}
.brand-txt{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-t{font-weight:700;font-size:15px}
.brand-k{font-size:12px;color:var(--muted)}
@media (prefers-color-scheme: dark){ :root.never-dark .logos{background:#fff;border-radius:10px;padding:4px 10px} }
:root.never-dark .logos{background:#fff;border-radius:10px;padding:4px 10px}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.pill:hover{text-decoration:none;border-color:var(--line-2)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:var(--pos)} .pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)} .pill.warn .dot{background:var(--warn)}
.pill.err .dot{background:var(--neg-mark)}
.nav{max-width:1200px;margin:0 auto;padding:0 14px 8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;color:var(--ink-2);font-weight:600;font-size:14px;white-space:nowrap}
.nav a svg{width:18px;height:18px;flex:none}
.nav .sh{display:none}
.nav a:hover{background:var(--surface-2);text-decoration:none;color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.app{max-width:1200px;margin:0 auto;padding:0 20px 72px}
.filters{padding:16px 0 4px}
.frow,.filters.plain{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.fbox summary{display:none;list-style:none;cursor:pointer;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);font-weight:600;font-size:13.5px;box-shadow:var(--shadow)}
.fbox summary::-webkit-details-marker{display:none}
.fbox summary .sv{color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbox[open] summary{margin-bottom:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;color:var(--muted);font-weight:600}
select,input[type="text"],input[type="date"],input[type="search"],input[type="month"]{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:7px 12px;min-height:38px;max-width:100%;box-shadow:0 1px 1px rgba(16,24,40,.03)}
select:hover,input:hover{border-color:var(--muted)}
.sec{margin-top:28px;scroll-margin-top:130px}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 6px}
.act{font-family:var(--f-display);font-weight:700;font-size:25px;line-height:1.3;margin:0 0 14px;text-wrap:balance;max-width:70ch;letter-spacing:-.01em}
.act.sm{font-size:19px;max-width:80ch}
.lede{color:var(--ink-2);margin:-6px 0 14px;max-width:80ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.grid2>.card+.card{margin-top:0}
.card-h{font-size:14px;color:var(--ink);margin:0 0 12px;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);padding:9px 12px;border-radius:10px;margin:0 0 12px;max-width:95ch}
.note.info{background:var(--accent-soft)}
.muted{color:var(--muted)} .small{font-size:13px}
.exec-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ex{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.ex-n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:14px;display:grid;place-items:center}
.ex-t{margin:0;font-weight:700;font-size:15.5px;line-height:1.45}
.ex-sw{margin:6px 0 0;color:var(--ink-2)}
.ex-a{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;align-items:baseline}
.ex-a .tag{font-size:11.5px;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:999px;font-weight:700}
.ex-a b{font-weight:700;color:var(--muted);font-size:12px;margin-right:4px}
.ex-l{display:inline-block;margin-top:8px;font-size:13.5px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.tile .l{font-size:12.5px;color:var(--muted);margin:0;font-weight:600}
.tile .v{font-size:24px;font-weight:700;margin:4px 0 0;line-height:1.2;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile .d{font-size:13px;color:var(--ink-2);margin:6px 0 0}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2);background:var(--surface-2)}
.chip.pos{color:var(--pos);background:var(--pos-soft)} .chip.neg{color:var(--neg);background:var(--neg-soft)}
.chip span{font-size:9px}
.tile .v .chip{font-size:20px;padding:2px 10px}
.tile .v .chip span{font-size:12px}
.node .h .chip{font-size:13px}
.gk{display:inline-flex;align-items:center;white-space:nowrap}
.vs{font-size:11px;color:var(--muted);margin:0 8px 0 4px;font-weight:700}
.tile .v .vs{font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.badge.acc{color:var(--accent-ink);background:var(--accent-soft)}
.badge.warn{color:var(--warn);background:var(--warn-soft)}
.badge.neg{color:var(--neg);background:var(--neg-soft)}
.badge.pos{color:var(--pos);background:var(--pos-soft)}
.badge.pos::before,.badge.warn::before,.badge.neg::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tbl-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom;background:var(--surface)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.go{cursor:pointer}
.tbl tr.go:hover td{background:var(--surface-2)}
.tbl tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.tbl .nm{font-weight:600}
.tbl .sub{font-size:12px;color:var(--muted);font-weight:400}
.tbl th.grp{text-align:center;color:var(--ink-2);border-bottom:1px solid var(--line)}
.tbl tr.tot td{font-weight:700;background:var(--surface-2)}
.ba-t td,.ba-t th{white-space:nowrap}
.barcell{display:flex;align-items:center;gap:8px;min-width:170px}
.barcell .bt{flex:1;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.barcell .bf{height:8px;border-radius:999px;background:var(--bar)}
.barcell .bf.acc{background:var(--accent)}
.barcell .bv{min-width:68px;text-align:right;font-variant-numeric:tabular-nums}
.seg,.fchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.seg button,.fchips button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;text-align:left;line-height:1.25;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button:hover,.fchips button:hover{border-color:var(--muted)}
.seg button[aria-pressed="true"],.fchips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.seg button .c{display:block;font-size:12px;font-weight:500;opacity:.8}
.fchips .n{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:12px}
.fchips button[aria-pressed="true"] .n{background:rgba(255,255,255,.25);color:inherit}
.chart{width:100%;min-height:40px;position:relative}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--f-body)}
.tree{display:grid;gap:12px}
.tree .root{border-left:4px solid var(--accent)}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.node .q{font-size:12.5px;color:var(--muted);margin:0;font-weight:600}
.node .h{font-weight:700;margin:0;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.node .f{margin:0;color:var(--ink-2);font-size:14px}
.node.off{background:transparent;border-style:dashed;box-shadow:none}
.acts{list-style:none;margin:0;padding:0}
.acts li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.acts li:first-child{border-top:0}
.acts .no{width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);font-size:12px;font-weight:700;display:grid;place-items:center}
.acts .no.qw{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.acts .w{font-weight:600}
.acts .m{font-size:13px;color:var(--ink-2)}
.acts .r{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.list-plain{margin:0;padding-left:18px}
.list-plain li{margin:4px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;min-height:38px;box-shadow:0 1px 1px rgba(16,24,40,.04)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,transparent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 12px;min-height:32px;font-size:13px}
.btn svg{width:16px;height:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--radius);padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.msg{font-size:13.5px;padding:9px 12px;border-radius:10px;background:var(--surface-2);margin-top:10px}
.msg.err{color:var(--neg);background:var(--neg-soft)}
.msg.ok{color:var(--pos);background:var(--pos-soft)}
.crumb{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-top:18px}
.prog{position:relative;height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:visible}
.prog .f{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--bar)}
.prog .f.pos,.prog .f.warn,.prog .f.neg{background:var(--accent)} .prog .f.acc{background:var(--accent)}
.prog .pj{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--purple) 30%,transparent) 0 4px,transparent 4px 8px)}
.prog .tg{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.prog-l{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums}
.seg.skr-seg{display:none}
.skr-seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.skr-seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-height:40px}
.skr-seg button .ic{width:16px;height:16px}
.skr-seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:var(--shadow);border:0}
details.notes{margin-top:2px}
details.notes summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;list-style:none}
details.notes summary::-webkit-details-marker{display:none}
details.notes .note{margin-top:8px;font-size:12.5px}
@media (max-width:640px){
  .seg.skr-seg{display:flex;width:100%;margin-bottom:10px}
  .skr-seg button{flex:1;justify-content:center}
  #sku-month[data-show="top"] .skr.low,#sku-month[data-show="low"] .skr.top{display:none}
  .sum .tiles .tile:first-child .ti-sp{display:block}
}
.ch-x{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ch-x .chip{font-size:12px;display:inline-flex;align-items:center;gap:4px}
.ch-x .chip .ic{width:13px;height:13px}
.qa{list-style:none;margin:0;padding:0}
.qa li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.qa li:first-child{border-top:0}
.qa .no{width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);font-size:11.5px;font-weight:700;display:grid;place-items:center;color:var(--ink)}
.qa .no.qw{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.qa-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:600}
.qa-v{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.card.txt .lead{margin:0;font-size:14.5px;font-weight:600;line-height:1.5}
details.more-acts>summary{cursor:pointer;list-style:none;margin:0}
details.more-acts>summary::-webkit-details-marker{display:none}
details.more-acts[open]>summary{margin-bottom:8px}
.card-h .ic{vertical-align:-3px}
.ba-h .ic{color:var(--purple)}
.exec-list .ex{background:var(--surface);}
.ex-n{background:linear-gradient(135deg,var(--accent),var(--purple))}
.tile,.card,.drv-c,.bai{border-color:var(--line)}
.pg-bottom .ins-list{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.pg-bottom .ins-list li::marker{color:var(--purple)}
.pg-bottom .ins-list li b{color:var(--ink)}
.pg-bottom .card+.card,.pg-bottom details{margin-top:12px}
.pg-bottom .sw-p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.rng{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.rng select{font-size:12.5px;padding:5px 26px 5px 10px;min-height:34px;border-radius:9px;border:1px solid var(--line-2);background-color:var(--surface)}
.rng span{color:var(--muted);font-size:12px}
.skr-h .rng{margin-left:auto}
.note-card{border-style:dashed}
@media (max-width:640px){ .skr-h{flex-wrap:wrap} .skr-h .rng{margin-left:44px} }
.badge.disc{background:#F3F1F6;color:#6C7088;border:1px dashed #C9C3DE;font-weight:600}

@keyframes me-in{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes me-idle{0%,86%,100%{transform:translateX(-50%) rotate(0)}89%{transform:translateX(-50%) rotate(-7deg)}93%{transform:translateX(-50%) rotate(5deg)}97%{transform:translateX(-50%) rotate(-2deg)}}
@keyframes me-hi{0%{transform:translateX(-50%) translateY(0) rotate(0)}20%{transform:translateX(-50%) translateY(-5px) rotate(-11deg)}45%{transform:translateX(-50%) translateY(-3px) rotate(9deg)}70%{transform:translateX(-50%) translateY(-1px) rotate(-5deg)}100%{transform:translateX(-50%) translateY(0) rotate(0)}}

<script>
(function(){
'use strict';

/* ---------- format & util ---------- */
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const NF0=new Intl.NumberFormat('id-ID',{maximumFractionDigits:0});
const NF1=new Intl.NumberFormat('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1});
const NF2=new Intl.NumberFormat('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
const MIN_EXP=3; // SKU "tidak terjual" = seharusnya >=3 pcs berdasarkan run-rate pembanding, tapi 0
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,el)=>(el||document).querySelector(s);
const $$=(s,el)=>[...(el||document).querySelectorAll(s)];
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);
function rp(v){ if(v==null||!isFinite(v)) return '—'; const a=Math.abs(v); let s;
  if(a>=1e9) s=NF2.format(a/1e9)+' M'; else if(a>=1e8) s=NF0.format(a/1e6)+' jt'; else if(a>=1e6) s=NF1.format(a/1e6)+' jt'; else if(a>=1e3) s=NF0.format(a/1e3)+' rb'; else s=NF0.format(a);
  return (v<0?'−':'')+'Rp'+s; }
function rpS(v){ if(v==null||!isFinite(v)) return '—'; return (v>=0?'+':'')+rp(v); }
function pct(g,dp){ if(g==null||!isFinite(g)) return '—'; const f=dp===0?NF0:NF1; return (g>=0?'+':'−')+f.format(Math.abs(g*100))+'%'; }
function pctAbs(g){ return NF0.format(Math.abs(Math.round(g*100)))+'%'; }
function pctRange(list){ const v=list.map(x=>Math.round(Math.abs(x)*100)).filter(isFinite).sort((a,b)=>a-b); if(!v.length) return ''; return v[0]===v[v.length-1]?v[0]+'%':v[0]+'–'+v[v.length-1]+'%'; }
const num=v=>NF0.format(Math.round(v||0));
function chip(g,t){ if(g==null||!isFinite(g)) return '<span class="chip">—</span>'; t=t==null?0.03:t; const c=g>t?'pos':(g<-t?'neg':''); const ic=g>t?'▲':(g<-t?'▼':'■'); return '<span class="chip '+c+'"><span aria-hidden="true">'+ic+'</span>'+pct(g)+'</span>'; }
function joinId(a){ a=a.filter(Boolean); if(a.length<=1) return a.join(''); return a.slice(0,-1).join(', ')+' dan '+a[a.length-1]; }
const pdt=s=>{const p=String(s).split('-').map(Number); return new Date(Date.UTC(p[0],p[1]-1,p[2]));};

const PROMO_TIERS=[[0.50,0.30,0.20],[0.30,0.20,0.10],[0.25,0.15,0.10],[0.20,0.15,0.05],[0.15,0.10,0.05]];

function promoTier(p90){ if(!(p90>=PROMO_MIN)) return null; for(const t of PROMO_TIERS) if(t[0]<=p90+0.005) return t; return PROMO_TIERS[PROMO_TIERS.length-1]; }

function promoCalc(C){ const ms=promoMonths(C.list); const R=roiMin(); const key=hetVer+'|'+R+'|'+S.ui.region+'|'+S.ui.format+'|'+ms.map(p=>p.id+':'+p.raw.length+':'+p.days).join('|'); if(promoMemo.k===key) return promoMemo.v;

  for(let i=0;i<text.length;i++){ const ch=text[i];

  if(t.dataset&&t.dataset.dcut!=null){ const d=S.drafts[+t.dataset.dcut]; if(d&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){ d.cutoff=t.value; d.cutoffAssumed=false; } return; }

  if(t.id==='f-pl'){ const f=t.files[0], c=t.dataset.code; t.value=''; if(f&&c) plUpload(c,f); return; }
  if(t.id==='vis-at'&&S.visEdit){ S.visEdit.at=t.value; return; }
  if(t.id==='f-pk'){ const fs=[...t.files]; t.value=''; if(fs.length) pkBulk(fs); return; }
  if(t.id==='f-pk-one'){ const c=t.dataset.sku, f=t.files[0]; t.value=''; if(c&&f) pkOne(c,f); return; }
  if(t.type==='file'){ const kind=t.id==='f-csr'?'csr':t.id==='f-ba'?'ba':t.id==='f-het'?'het':'promo'; handleFiles(kind,t.files); t.value=''; if(kind==='csr'&&location.hash!=='#data') location.hash='data'; }
});
let qT=null; document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.pkup){ e.preventDefault(); e.target.click(); } });
document.addEventListener('input',e=>{ const vt=e.target; if(vt.dataset&&vt.dataset.vis&&S.visEdit){ const r=S.visEdit.rows[+vt.dataset.i]; if(r){ r[vt.dataset.vis]=vt.value; visLive(); } return; } if(vt.id==='vis-by'&&S.visEdit){ S.visEdit.by=vt.value; return; } if(e.target.id==='ba-q'){ S.ui.baQ=e.target.value; clearTimeout(qT); qT=setTimeout(renderBaList,150); return; } if(e.target.id==='sk-q'){ S.ui.skuQ=e.target.value; clearTimeout(qT); qT=setTimeout(renderSkuBody,150); } if(e.target.id==='pr-q'){ S.ui.prQ=e.target.value; clearTimeout(qT); qT=setTimeout(schedule,200); } });
document.addEventListener('click',e=>{ const pm=e.target.closest('.pr-r[data-prm]'); if(pm&&e.detail>1){ S.ui.prFrom=S.ui.prTo=pm.dataset.prm; schedule(); return; } });
document.addEventListener('click',e=>{ const pu=e.target.closest('[data-pkup]'); if(pu){ e.preventDefault(); const inp=$('#f-pk-one'); inp.dataset.sku=pu.dataset.pkup; inp.click(); return; }
  const t=e.target.closest('button,a,tr.go'); if(!t) return;
  if(vpClick(t)) return;
  if(t.dataset.jump){ const el=document.getElementById(t.dataset.jump); if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); const d=el.querySelector('details.more-acts'); if(d) d.open=true; } return; }
  if(t.dataset.skr){ S.ui.skuRank=t.dataset.skr; const sec=$('#sku-month'); if(sec){ sec.dataset.show=t.dataset.skr; $$('#sku-month [data-skr]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.skr===t.dataset.skr))); } return; }
  if(t.dataset.pksave){ pkSave(); return; } if(t.dataset.pkcancel){ S.pkDraft=null; S.msg.pk=null; renderPk(); return; }
  if(t.dataset.bafilter){ S.ui.baFilter=t.dataset.bafilter; renderBaList(); return; }
  if(t.dataset.baview){ S.ui.baView=t.dataset.baview; renderBaList(); return; }
  if(t.dataset.skutab||t.dataset.skusub||t.dataset.skustore){ if(t.dataset.skutab) S.ui.skuTab=t.dataset.skutab; if(t.dataset.skusub) { S.ui.skuSub=t.dataset.skusub; S.ui.skuTab='turun'; } if(t.dataset.skustore) S.ui.skuStore=t.dataset.skustore; S.ui.skuAll=false; if(t.tagName==='BUTTON'){ renderSkuBody(); return; } }
  if(t.dataset.act==='sku-all'){ S.ui.skuAll=!S.ui.skuAll; renderSkuBody(); return; }
  if(t.dataset.act==='pr-all'){ S.ui.prAll=!S.ui.prAll; schedule(); return; }
  if(t.dataset.prq){ const [a,b]=t.dataset.prq.split('|'); S.ui.prFrom=a; S.ui.prTo=b; S.ui.prAll=false; schedule(); return; }
  if(t.dataset.ksort){ S.ui.kSort=t.dataset.ksort; S.ui.skuAll=false; renderSkuBody(); return; }
  if(t.tagName==='TR'&&t.dataset.go&&!e.target.closest('a')){ location.hash=t.dataset.go; return; }
  if(t.dataset.pick){ document.getElementById(t.dataset.pick).click(); return; }
  if(t.dataset.save!=null){ saveDraft(+t.dataset.save); return; }
  if(t.dataset.cancel!=null){ S.drafts.splice(+t.dataset.cancel,1); schedule(); return; }
  if(t.dataset.savex){ saveX(t.dataset.savex); return; }
  if(t.dataset.cancelx){ if(t.dataset.cancelx==='ba') S.baDraft=null; else if(t.dataset.cancelx==='het') S.hetDraft=null; else S.promoDraft=null; schedule(); return; }
  if(t.dataset.hetreset){ (async()=>{ try{ if(S.db) await S.db.doc('ref/het').delete(); S.hetOv=null; hetVer++; S.msg.het={t:'ok',m:'Kembali ke daftar HET '+S.seed.hetSrc+'.'}; }catch(e){ S.msg.het={t:'err',m:dbErr(e)}; } schedule(); })(); return; }
  if(t.dataset.tpl){ downloadTpl(t.dataset.tpl); return; }
  if(t.dataset.del){ const id=t.dataset.del; confirmBox('Hapus periode '+id+'?','Data sales periode ini akan dihapus dari dashboard. '+(S.seed.periods.some(p=>p.id===id)&&!S.dbPeriods[id]?'Data awal bisa dimunculkan lagi dengan upload ulang file periode tersebut.':'Upload ulang file untuk mengembalikannya.'),'Hapus',()=>delPeriod(id)); return; }
  if(t.dataset.modal==='close'){ closeModal(); return; }
  if(t.dataset.modal==='ok'){ const f=modalFn; closeModal(); if(f) f(); return; }
});
let modalFn=null;
function confirmBox(title,body,ok,fn){ modalFn=fn; $('#modal-c').innerHTML='<h2 id="modal-t" style="margin:0 0 8px;font-size:18px">'+esc(title)+'</h2><p style="margin:0 0 16px;color:var(--ink-2)">'+esc(body)+'</p><div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-modal="close">Batal</button><button class="btn danger" type="button" data-modal="ok">'+esc(ok)+'</button></div>'; $('#modal').classList.add('on'); $('#modal [data-modal="close"]').focus(); }
function closeModal(){ $('#modal').classList.remove('on'); modalFn=null; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{ const d=e.target.closest&&e.target.closest('[data-drop]'); if(d){ e.preventDefault(); d.classList.add('over'); } }));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{ const d=e.target.closest&&e.target.closest('[data-drop]'); if(d){ d.classList.remove('over'); if(ev==='drop'){ e.preventDefault(); handleFiles(d.dataset.drop,e.dataTransfer.files); } } }));
window.addEventListener('hashchange',()=>{ window.scrollTo(0,0); schedule(); });
let rT=null, lastW=window.innerWidth; window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(Math.abs(window.innerWidth-lastW)>8){ lastW=window.innerWidth; drawCharts(); } },150); });
/* tooltip */
const tip=$('#tip'); let tipEl=null;
function showTip(el,x,y){ tip.textContent=el.getAttribute('data-tip'); tip.classList.toggle('wide',tip.textContent.length>160); tip.classList.add('on'); const r=tip.getBoundingClientRect(); let L=x+14, T=y+14; if(L+r.width>window.innerWidth-8) L=x-r.width-14; if(T+r.height>window.innerHeight-8) T=y-r.height-14; tip.style.left=Math.max(8,L)+'px'; tip.style.top=Math.max(8,T)+'px'; }
document.addEventListener('pointermove',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); if(el){ tipEl=el; showTip(el,e.clientX,e.clientY); } else if(tipEl){ tipEl=null; tip.classList.remove('on'); } });
document.addEventListener('focusin',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); if(el){ const r=el.getBoundingClientRect(); showTip(el,r.left+r.width/2,r.bottom); } });
document.addEventListener('focusout',()=>tip.classList.remove('on'));
(()=>{ const b=document.createElement('button'); b.type='button'; b.className='totop'; b.setAttribute('aria-label','Kembali ke atas'); b.title='Kembali ke atas';
  b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  b.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'})); document.body.appendChild(b);
  const nv=document.getElementById('nav');
  const f=()=>{ b.classList.toggle('on',window.scrollY>window.innerHeight*1.5); const r=nv&&nv.getBoundingClientRect(); b.style.bottom=r&&getComputedStyle(nv).position==='fixed'&&r.top>window.innerHeight/2?Math.round(window.innerHeight-r.top+12)+'px':''; };
  window.addEventListener('scroll',f,{passive:true}); window.addEventListener('resize',f); f(); if(nv) nv.addEventListener('click',e=>{ const a=e.target.closest('a[href^="#"]'); if(a&&a.getAttribute('href')===location.hash) window.scrollTo({top:0,behavior:'smooth'}); }); })();
window.addEventListener('scroll',()=>{ if(tipEl){ tip.classList.remove('on'); tipEl=null; } },{passive:true});

/* ---------- boot ---------- */
fetch('data/packs.json').then(r=>r.ok?r.json():null).then(j=>{ if(j){ window.PKW=j; if(S.seed) schedule(); } }).catch(()=>{});
fetch('data/seed.json').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }).then(j=>{ S.seed=j; if(!S.ba&&j.ba) S.ba=j.ba; if(!S.tg&&j.tg) S.tg=j.tg; renderFoot(); render(); }).catch(e=>{ $('#view').innerHTML='<section class="sec"><div class="card"><p class="msg err">Data awal gagal dimuat ('+esc(e.message)+'). Muat ulang halaman.</p></div></section>'; S.seed={stores:{},skus:{},periods:[]}; render(); });

if(window.claude&&typeof window.claude.use==='function') initDb(); else { S.dbState='none'; }
})();
</script>
</body>
</html>
